<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .section { background: #f0f0f0; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>测试页面</h1>
    <p>如果你能看到这个页面，说明浏览器正常工作。</p>
    
    <div class="section" id="section-learning">
        <h2>学习目标</h2>
        <p>这是学习目标部分。</p>
        <button class="btn" onclick="showChapter(1)">开始学习</button>
    </div>
    
    <div class="section" id="section-chapter1" style="display: none;">
        <h2>第一章</h2>
        <p>这是第一章内容。</p>
        <button class="btn" onclick="showChapter(2)">下一章</button>
    </div>
    
    <div class="section" id="section-chapter2" style="display: none;">
        <h2>第二章</h2>
        <p>这是第二章内容。</p>
        <button class="btn" onclick="showChapter(1)">返回</button>
    </div>
    
    <script>
        function showChapter(num) {
            document.querySelectorAll('.section').forEach(el => el.style.display = 'none');
            document.getElementById('section-chapter' + num).style.display = 'block';
            if (num === 0) document.getElementById('section-learning').style.display = 'block';
        }
    </script>
</body>
</html>
